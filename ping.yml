name: Ping Kari bots

on:
  schedule:
    - cron: "*/5 4-16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Jumys bot
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://kari-jumys-bot.onrender.com
      - name: Ping Director bot
        # ЗАМЕНИТЕ адрес на тот, что покажет Render у нового сервиса kari-director-bot
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://kari-director-bot.onrender.com
